<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 最新密码 · 玻璃风格</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* ===== 苹果风格玻璃效果背景 ===== */
            background: radial-gradient(ellipse at 20% 50%, #0d0d2b, #1a1a3e 40%, #0a0a1a 80%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== 动态光晕 (增强玻璃质感) ===== */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(110, 60, 255, 0.25), transparent 70%);
            animation: floatGlow 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 60%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(0, 200, 255, 0.15), transparent 70%);
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        /* ===== 玻璃卡片容器 ===== */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            /* ===== 核心玻璃效果 ===== */
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 40px 36px 36px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* ===== 标题 ===== */
        .header {
            text-align: center;
            margin-bottom: 34px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== 信息字段 ===== */
        .field {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 16px 20px 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .field:last-of-type {
            margin-bottom: 0;
        }

        .field:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .field .label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .field .label .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 12px;
            border-radius: 20px;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .field .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .field .value {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            word-break: break-all;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 16px;
            border-radius: 12px;
            flex: 1;
            min-width: 0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .field .value:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        /* 房间号高亮色 */
        .field.room .value {
            color: #ffd866;
            border-left: 3px solid rgba(255, 216, 102, 0.5);
            padding-left: 16px;
        }

        /* 密码高亮色 */
        .field.password .value {
            color: #7fc9ff;
            border-left: 3px solid rgba(127, 201, 255, 0.5);
            padding-left: 16px;
        }

        /* ===== 复制按钮 (玻璃风格) ===== */
        .btn-copy {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-copy:active {
            transform: scale(0.94);
        }

        .btn-copy .icon-copy {
            font-size: 16px;
            line-height: 1;
        }

        .btn-copy.copied {
            background: rgba(100, 220, 150, 0.15);
            color: #7cf9a8;
            border-color: rgba(100, 220, 150, 0.2);
        }

        /* ===== 底部信息 ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }

        .footer .update-time {
            display: inline-block;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ===== Toast 提示 (玻璃风格) ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20, 20, 40, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 999;
            letter-spacing: 0.3px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .check {
            margin-right: 8px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .card {
                padding: 28px 20px 24px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            .field {
                padding: 14px 16px 16px;
            }

            .field .value {
                font-size: 22px;
                padding: 2px 12px;
                letter-spacing: 1px;
            }

            .btn-copy {
                padding: 6px 12px;
                font-size: 12px;
            }

            .btn-copy .icon-copy {
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .field .value {
                font-size: 18px;
                padding: 2px 10px;
            }

            .btn-copy {
                padding: 5px 10px;
                font-size: 11px;
            }

            .card {
                padding: 20px 14px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 主卡片 ===== -->
    <div class="card">
        <!-- 标题（已去掉图标和副标题） -->
        <div class="header">
            <h1>最新密码</h1>
        </div>

        <!-- 房间号 -->
        <div class="field room">
            <div class="label">
                <span>📟 房间号</span>
                <span class="badge">ROOM</span>
            </div>
            <div class="value-row">
                <span class="value" id="roomNumber">--</span>
                <button class="btn-copy" id="copyRoomBtn" aria-label="复制房间号">
                    <span class="icon-copy">📋</span>
                    <span class="btn-text">复制</span>
                </button>
            </div>
        </div>

        <!-- 房间密码 -->
        <div class="field password">
            <div class="label">
                <span>🔑 房间密码</span>
                <span class="badge">PASSWORD</span>
            </div>
            <div class="value-row">
                <span class="value" id="roomPassword">--</span>
                <button class="btn-copy" id="copyPwdBtn" aria-label="复制房间密码">
                    <span class="icon-copy">📋</span>
                    <span class="btn-text">复制</span>
                </button>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <span class="update-time">🕒 最后更新 · <span id="updateTime">--</span></span>
        </div>
    </div>

    <!-- ===== Toast 提示 ===== -->
    <div class="toast" id="toast">
        <span class="check">✅</span>
        <span id="toastMessage">已复制</span>
    </div>

    <!-- ============================================================ -->
    <!-- ===== 配置区：修改下面两个变量即可更新房间信息 ===== -->
    <script>
        // =============================================================
        //  ★★★ 在这里修改你的房间号和密码 ★★★
        // =============================================================
        const ROOM_NUMBER = '123456'; // ← 改成你的房间号
        const ROOM_PASSWORD = '8888'; // ← 改成你的房间密码
        // =============================================================
    </script>
    <!-- ============================================================ -->

    <script>
        (function() {
            'use strict';

            // ----- DOM 引用 -----
            const roomNumberEl = document.getElementById('roomNumber');
            const roomPasswordEl = document.getElementById('roomPassword');
            const copyRoomBtn = document.getElementById('copyRoomBtn');
            const copyPwdBtn = document.getElementById('copyPwdBtn');
            const updateTimeEl = document.getElementById('updateTime');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            // ----- 获取最终数据（URL 参数优先） -----
            function getRoomData() {
                const params = new URLSearchParams(window.location.search);
                const room = params.get('room') || params.get('r') || null;
                const pwd = params.get('pwd') || params.get('password') || params.get('p') || null;

                return {
                    roomNumber: room || ROOM_NUMBER || '未设置',
                    roomPassword: pwd || ROOM_PASSWORD || '未设置'
                };
            }

            // ----- 渲染 -----
            function render() {
                const data = getRoomData();
                roomNumberEl.textContent = data.roomNumber;
                roomPasswordEl.textContent = data.roomPassword;

                // 更新时间
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const timeStr =
                    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                updateTimeEl.textContent = timeStr;
            }

            // ----- Toast 反馈 -----
            let toastTimer = null;

            function showToast(msg) {
                toastMessage.textContent = msg || '已复制';
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ----- 复制功能 -----
            function copyText(text, successMsg) {
                if (!text || text === '未设置') {
                    showToast('⚠️ 暂无内容可复制');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(successMsg || '✅ 已复制');
                    }).catch(() => {
                        fallbackCopy(text, successMsg);
                    });
                } else {
                    fallbackCopy(text, successMsg);
                }
            }

            function fallbackCopy(text, successMsg) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(successMsg || '✅ 已复制');
                } catch (_) {
                    showToast('❌ 复制失败，请手动复制');
                }
                document.body.removeChild(textarea);
            }

            // ----- 按钮复制事件 -----
            copyRoomBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const text = roomNumberEl.textContent;
                copyText(text, '📟 房间号已复制');
                this.classList.add('copied');
                setTimeout(() => this.classList.remove('copied'), 800);
            });

            copyPwdBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const text = roomPasswordEl.textContent;
                copyText(text, '🔑 密码已复制');
                this.classList.add('copied');
                setTimeout(() => this.classList.remove('copied'), 800);
            });

            // ----- 点击值区域也可以复制 -----
            roomNumberEl.addEventListener('click', function() {
                const text = this.textContent;
                copyText(text, '📟 房间号已复制');
                copyRoomBtn.classList.add('copied');
                setTimeout(() => copyRoomBtn.classList.remove('copied'), 800);
            });

            roomPasswordEl.addEventListener('click', function() {
                const text = this.textContent;
                copyText(text, '🔑 密码已复制');
                copyPwdBtn.classList.add('copied');
                setTimeout(() => copyPwdBtn.classList.remove('copied'), 800);
            });

            // ----- 初始化渲染 -----
            render();

            window.addEventListener('popstate', render);
            window.refreshRoom = render;

            console.log('🎮 游戏房间已加载 (玻璃风格，标题已改)');
            console.log('💡 提示：修改 ROOM_NUMBER 和 ROOM_PASSWORD 变量即可更新');
            console.log('🔗 也支持 URL 参数：?room=123456&pwd=8888');

        })();
    </script>

</body>
</html>
